<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>PyroGuard - diagrama de conexiones del nodo ESP32</title>
  <style>
    :root { --bg:#ffffff; --fg:#1f2937; --box:#f3f4f6; --sig:#2563eb; --p5:#dc2626; --p33:#ea580c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111827; --fg:#e5e7eb; --box:#1f2937; --sig:#60a5fa; --p5:#f87171; --p33:#fb923c; }
    }
    text { fill: var(--fg); }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--fg); stroke-width: 1.5; }
    .w { stroke: var(--sig); stroke-width: 2; fill: none; }
    .g { stroke: var(--fg); stroke-width: 2; fill: none; }
    .p5 { stroke: var(--p5); stroke-width: 2; fill: none; }
    .res { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .dot { fill: var(--sig); }
    .t { font-weight: 600; }
    .s { font-size: 11px; }
    .pin { fill: var(--fg); }
  </style>
  <defs>
    <g id="gnd"><line class="g" x1="0" y1="0" x2="0" y2="8"/><line class="g" x1="-12" y1="8" x2="12" y2="8"/><line class="g" x1="-8" y1="13" x2="8" y2="13"/><line class="g" x1="-4" y1="18" x2="4" y2="18"/></g>
  </defs>
  <rect class="bg" width="1100" height="780"/>
  <text x="550" y="28" text-anchor="middle" class="t" font-size="18">PyroGuard - nodo ESP32 DevKit V1</text>

  <!-- ESP32 -->
  <rect class="box" x="450" y="50" width="200" height="620" rx="8"/>
  <text x="550" y="75" text-anchor="middle" class="t">ESP32 DevKit V1</text>
  <g class="pin">
    <circle cx="450" cy="130" r="4"/><circle cx="450" cy="250" r="4"/><circle cx="450" cy="430" r="4"/><circle cx="450" cy="550" r="4"/>
    <circle cx="650" cy="110" r="4"/><circle cx="650" cy="160" r="4"/><circle cx="650" cy="210" r="4"/><circle cx="650" cy="385" r="4"/><circle cx="650" cy="435" r="4"/>
  </g>
  <text x="460" y="134">GPIO4</text><text x="460" y="254">GPIO34 (ADC1)</text><text x="460" y="434">GPIO27</text><text x="460" y="554">GPIO14</text>
  <text x="640" y="114" text-anchor="end">GPIO16</text><text x="640" y="164" text-anchor="end">GPIO17</text>
  <text x="640" y="214" text-anchor="end">GPIO18</text><text x="640" y="389" text-anchor="end">GPIO21</text><text x="640" y="439" text-anchor="end">GPIO22</text>
  <text x="550" y="590" text-anchor="middle" class="s">Alimentación: VIN (5 V), 3V3, GND</text>
  <text x="550" y="606" text-anchor="middle" class="s">todos los GND unidos entre sí</text>

  <!-- DHT22 -->
  <rect class="box" x="40" y="70" width="160" height="110" rx="6"/>
  <text x="50" y="90" class="t">DHT22</text>
  <text x="50" y="110" class="s">VCC → 3V3</text><text x="50" y="126" class="s">GND → GND</text><text x="50" y="142" class="s">DATA →</text>
  <text x="50" y="162" class="s">temperatura / humedad</text>
  <line class="w" x1="200" y1="130" x2="450" y2="130"/>
  <text x="230" y="122" class="s">DATA</text>
  <text x="230" y="150" class="s">(pull-up 10k a 3V3 si no trae módulo)</text>

  <!-- MQ-2 + divisor -->
  <rect class="box" x="40" y="200" width="160" height="110" rx="6"/>
  <text x="50" y="220" class="t">MQ-2 (humo / gas)</text>
  <text x="50" y="240" class="s">VCC → VIN (5 V)</text><text x="50" y="256" class="s">GND → GND</text><text x="50" y="272" class="s">AO →</text>
  <line class="w" x1="200" y1="250" x2="230" y2="250"/>
  <rect class="res" x="230" y="240" width="60" height="20"/><text x="260" y="234" text-anchor="middle" class="s">R1 10k</text>
  <line class="w" x1="290" y1="250" x2="450" y2="250"/>
  <circle class="dot" cx="320" cy="250" r="4"/>
  <line class="w" x1="320" y1="250" x2="320" y2="290"/>
  <rect class="res" x="310" y="290" width="20" height="60"/><text x="340" y="324" class="s">R2 15k</text>
  <line class="g" x1="320" y1="350" x2="320" y2="365"/><use href="#gnd" x="320" y="365"/>
  <text x="345" y="244" class="s">≈ 3.0 V máx (5 V × 15/25)</text>

  <!-- Llama -->
  <rect class="box" x="40" y="380" width="160" height="100" rx="6"/>
  <text x="50" y="400" class="t">Sensor de llama IR</text>
  <text x="50" y="420" class="s">VCC → 3V3</text><text x="50" y="436" class="s">GND → GND</text><text x="50" y="452" class="s">DO →</text>
  <line class="w" x1="200" y1="430" x2="450" y2="430"/>
  <text x="230" y="422" class="s">DO (LOW = llama)</text>

  <!-- Pulsador -->
  <rect class="box" x="40" y="510" width="160" height="80" rx="6"/>
  <text x="50" y="530" class="t">Pulsador (prueba)</text>
  <text x="50" y="550" class="s">terminal A → 3V3</text><text x="50" y="566" class="s">terminal B →</text>
  <line class="w" x1="200" y1="550" x2="450" y2="550"/>
  <circle class="dot" cx="320" cy="550" r="4"/>
  <line class="w" x1="320" y1="550" x2="320" y2="580"/>
  <rect class="res" x="310" y="580" width="20" height="60"/><text x="340" y="614" class="s">R 10k pull-down</text>
  <line class="g" x1="320" y1="640" x2="320" y2="655"/><use href="#gnd" x="320" y="655"/>

  <!-- LEDs -->
  <g>
    <line class="w" x1="650" y1="110" x2="700" y2="110"/><rect class="res" x="700" y="100" width="60" height="20"/><text x="730" y="95" text-anchor="middle" class="s">220 Ω</text>
    <line class="w" x1="760" y1="110" x2="828" y2="110"/><circle cx="840" cy="110" r="12" fill="#16a34a" stroke="var(--fg)"/>
    <line class="g" x1="852" y1="110" x2="900" y2="110"/><line class="g" x1="900" y1="110" x2="900" y2="118"/><use href="#gnd" x="900" y="118"/><text x="925" y="114">LED verde</text>

    <line class="w" x1="650" y1="160" x2="700" y2="160"/><rect class="res" x="700" y="150" width="60" height="20"/><text x="730" y="145" text-anchor="middle" class="s">220 Ω</text>
    <line class="w" x1="760" y1="160" x2="828" y2="160"/><circle cx="840" cy="160" r="12" fill="#eab308" stroke="var(--fg)"/>
    <line class="g" x1="852" y1="160" x2="900" y2="160"/><use href="#gnd" x="900" y="160"/><text x="925" y="164">LED amarillo</text>

    <line class="w" x1="650" y1="210" x2="700" y2="210"/><rect class="res" x="700" y="200" width="60" height="20"/><text x="730" y="195" text-anchor="middle" class="s">220 Ω</text>
    <line class="w" x1="760" y1="210" x2="828" y2="210"/><circle cx="840" cy="210" r="12" fill="#dc2626" stroke="var(--fg)"/>
    <line class="g" x1="852" y1="210" x2="900" y2="210"/><use href="#gnd" x="900" y="210"/><text x="925" y="214">LED rojo</text>
  </g>
  <text x="700" y="85" class="s">ánodo hacia el GPIO (patita larga), cátodo a GND</text>

  <!-- Buzzer pasivo en oposición (sin transistor) -->
  <line class="w" x1="650" y1="385" x2="820" y2="385"/>
  <line class="w" x1="650" y1="435" x2="820" y2="435"/>
  <rect class="box" x="820" y="360" width="140" height="100" rx="6"/>
  <text x="890" y="384" text-anchor="middle" class="t">Buzzer pasivo</text>
  <text x="830" y="402" class="s">+ ← GPIO21</text>
  <text x="830" y="440" class="s">− ← GPIO22</text>
  <text x="890" y="478" text-anchor="middle" class="s">en oposición: 3 kHz, ~6.6 V pico a pico</text>

  <!-- Notas -->
  <g class="s">
    <text x="40" y="700" class="t" font-size="13">Notas</text>
    <text x="40" y="720">• MQ-2 a 5 V (VIN); DHT22, sensor de llama y pulsador (opcional) a 3V3. El buzzer va directo a GPIO21/22. Todos los GND comunes con el del ESP32.</text>
    <text x="40" y="738">• Nunca conectes AO del MQ-2 directo al ESP32: sale hasta 5 V y el pin tolera 3.3 V. Usa siempre el divisor R1/R2.</text>
    <text x="40" y="756">• GPIO34 es solo entrada y pertenece al ADC1, que sigue funcionando con el WiFi encendido.</text>
  </g>
</svg>
